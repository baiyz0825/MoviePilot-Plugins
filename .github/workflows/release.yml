# 推送到 main 后对比当前索引版本和上一份同代 Release：
# 没有 Release、版本变了、插件目录有变化则打包；也可手动跑，force 强制重打。
# V2 / V3 版本号必须分开（1.x / 2.x），Tag 是 SubtitleStudio_v版本，zip 是 subtitlestudio_v版本.zip。
name: Plugin Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package. Leave empty to use the workflow ref.
        required: false
        default: ""
      plugin_id:
        description: Optional plugin id to package, for example SubtitleStudio.
        required: false
        default: ""
      force:
        description: Force republish even when version and files match the last release.
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq zip unzip
          echo "jq=$(jq --version)"
          echo "zip=$(zip -v | head -n 1)"
          echo "unzip=$(unzip -v | head -n 1)"

      - name: Diagnose environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "======== 仓库与触发 ========"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
          echo "run=${{ github.run_id }} attempt=${{ github.run_attempt }}"
          echo "workflow_ref=${{ inputs.ref || github.ref }}"
          echo "plugin_id_filter=${{ inputs.plugin_id || '' }}"
          echo "force=${{ inputs.force || 'false' }}"
          echo ""
          echo "======== 工具版本 ========"
          git --version
          python3 --version
          jq --version
          zip -v 2>&1 | head -n 2 || true
          unzip -v 2>&1 | head -n 1 || true
          gh --version
          echo ""
          echo "======== HEAD 提交 ========"
          git log -1 --format=fuller
          echo ""
          echo "======== 版本门禁输入 ========"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ("package.json", "package.v2.json", "package.v3.json"):
              path = Path(name)
              print(f"--- {name} exists={path.exists()} ---")
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              if not data:
                  print("  <empty>")
                  continue
              for plugin_id, meta in data.items():
                  print(
                      f"  {plugin_id}: version={meta.get('version')} "
                      f"release={meta.get('release')} history={list((meta.get('history') or {}).keys())}"
                  )
          PY
          echo ""
          echo "======== 本地 Tag ========"
          git fetch --tags --force
          git tag -l 'SubtitleStudio_v*' || true
          echo ""
          echo "======== 远程 Release ========"
          gh release list --limit 20 || true

      - name: Check plugin versions
        run: |
          set -euo pipefail
          python3 .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Build and release plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILTER_PLUGIN_ID: ${{ inputs.plugin_id || '' }}
          FORCE_RELEASE: ${{ inputs.force || 'false' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/release_plugins.sh
          bash .github/scripts/release_plugins.sh
